services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports: ["3000:3000"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: elbeflow-dashboard
    depends_on: [otel-collector]
    restart: unless-stopped

  pipeline:
    build: .
    command: ["quality"]
    volumes: ["mobility-data:/app/data"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889"]

volumes:
  mobility-data:
