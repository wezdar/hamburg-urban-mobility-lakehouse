name: Cloud reference

on:
  push:
    branches: [main]
    paths:
      - ".openai/**"
      - "app/**"
      - "build/**"
      - "infra/**"
      - "observability/**"
      - "public/**"
      - "worker/**"
      - "Dockerfile.dashboard"
      - "compose.production.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/cloud-plan.yml"
  pull_request:
    paths:
      - ".openai/**"
      - "app/**"
      - "build/**"
      - "infra/**"
      - "observability/**"
      - "public/**"
      - "worker/**"
      - "Dockerfile.dashboard"
      - "compose.production.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/cloud-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: elbeflow:ci
