[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hamburg-urban-mobility-lakehouse"
version = "1.0.0"
description = "A production-minded data platform for Hamburg's public mobility signals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
dependencies = [
  "duckdb>=1.2,<2",
  "pyarrow>=19,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
dbt = ["dbt-duckdb>=1.9,<2"]

[project.scripts]
hamburg-mobility = "hamburg_mobility.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hamburg_mobility"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
